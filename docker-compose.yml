name: community-manager

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Deploys set IMAGE to a digest-pinned GHCR reference and `pull` it; local
    # dev leaves IMAGE unset and builds via the `build:` block above.
    image: ${IMAGE:-community-manager:latest}
    environment:
      ROOT_URL: ${ROOT_URL}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/community-manager?authSource=admin}
      METEOR_SETTINGS: ${METEOR_SETTINGS:-}
      PORT: 3000
    # The discord.js token-encryption key is read from
    # /run/secrets/encryption_key (never an env var; server/encryption.ts reads
    # it lazily). It comes from the app-secrets volume, owner-only for this
    # container's user — see the secrets-init service.
    volumes:
      - app-secrets:/run/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging: *default-logging
    networks:
      - traefik
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Router/service name (STACK) and host (STACK_HOST) are per-stack so many
    # branch deploys can share one Traefik without router-name collisions. The
    # defaults reproduce the original single-host behaviour
    # (STACK=community-manager, host=$DOMAIN), so an existing prod deploy that
    # sets neither variable is unaffected.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${STACK:-community-manager}.rule=Host(`${STACK_HOST:-${DOMAIN}}`)"
      - "traefik.http.routers.${STACK:-community-manager}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${STACK:-community-manager}.tls=true"
      - "traefik.http.routers.${STACK:-community-manager}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${STACK:-community-manager}.loadbalancer.server.port=3000"

  # One-shot: copies the stack's encryption key into the app-secrets volume,
  # owned by the app image's runtime user (uid/gid 1001 = `meteor`) at mode 400.
  # deploy.sh runs unprivileged and cannot chown the host file to 1001, and a
  # bind-mounted file keeps its host owner/mode, so the only other way for the
  # non-root app to read it was a world-readable key. Runs as root with just the
  # capabilities `install` needs, no network. Reuses the app image, so nothing
  # extra is pulled.
  secrets-init:
    image: ${IMAGE:-community-manager:latest}
    user: "0:0"
    entrypoint: ["install", "-o", "1001", "-g", "1001", "-m", "400", "/run/secrets/encryption_key", "/app-secrets/encryption_key"]
    secrets:
      - encryption_key
    volumes:
      - app-secrets:/app-secrets
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"
    logging: *default-logging

  # Single-member replica set (rs0), not a standalone: Meteor >= 3.5 keeps live
  # subscriptions current via change streams, which only exist on a replica set;
  # on a standalone it silently falls back to polling every 10 s. MONGO_URL needs
  # no replicaSet parameter (the driver discovers the topology), and there must be
  # no MONGO_OPLOG_URL, or Meteor picks oplog tailing over change streams.
  mongo:
    image: mongo:7.0.43
    restart: unless-stopped
    # A replica set with --auth requires a keyfile. It is generated here, inside
    # the container, once per stack and kept in the mongo-config volume — never on
    # the host or in the repo — because deploy.sh runs unprivileged and cannot
    # chown a host file to the mongodb user, while mongod refuses a keyfile that is
    # group- or world-readable. The container starts as root; the official
    # entrypoint then drops to mongodb and strips --replSet/--keyFile from the
    # temporary mongod it uses to create the root user on an empty volume.
    entrypoint:
      - bash
      - -euc
      - |
        KF=/data/configdb/rs-keyfile
        [ -s "$$KF" ] || (umask 077 && head -c 756 /dev/urandom | base64 > "$$KF")
        chown mongodb:mongodb "$$KF" && chmod 400 "$$KF"
        exec docker-entrypoint.sh "$$@"
      - --
    # --oplogSize only applies when the oplog is first created. 256 MB keeps up to
    # MAX_STACKS preview stacks affordable on one shared disk.
    command: ["--bind_ip_all", "--auth", "--replSet", "rs0", "--keyFile", "/data/configdb/rs-keyfile", "--oplogSize", "256"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "-u"
        - "${MONGO_INITDB_ROOT_USERNAME}"
        - "-p"
        - "${MONGO_INITDB_ROOT_PASSWORD}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        # Idempotently initiate rs0 (fresh volume, or a former standalone volume),
        # and report healthy only once this node is a writable PRIMARY, so the app
        # (depends_on: service_healthy) never sees an uninitiated set. The member
        # host is the compose service name, which every stack resolves on its own
        # internal network.
        - >-
          try { rs.status() } catch (e) { if (e.codeName !== 'NotYetInitialized') throw e;
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          db.hello().isWritablePrimary ? 1 : quit(1)
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    logging: *default-logging
    networks:
      - internal

volumes:
  app-secrets:
  mongo-data:
  mongo-config:

# The stack's encryption key on the host: ./encryption.key in the stack dir,
# generated once by scripts/deploy.sh, mode 600 owned by the deploy user. It is
# the source of truth — it survives `teardown --purge`, so DB backups stay
# decryptable — and is only read by secrets-init, which copies it into the
# app-secrets volume for the app. For a local `docker compose up`, create one
# first: `(umask 077 && openssl rand -hex 16 > encryption.key)`.
secrets:
  encryption_key:
    file: ./encryption.key

networks:
  traefik:
    external: true
  internal:
    driver: bridge
    internal: true
