name: community-manager

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Deploys set IMAGE to a digest-pinned GHCR reference and `pull` it; local
    # dev leaves IMAGE unset and builds via the `build:` block above.
    image: ${IMAGE:-community-manager:latest}
    environment:
      ROOT_URL: ${ROOT_URL}
      MONGO_URL: ${MONGO_URL:-mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/community-manager?authSource=admin}
      METEOR_SETTINGS: ${METEOR_SETTINGS:-}
      PORT: 3000
    # The discord.js token-encryption key is mounted as a file at
    # /run/secrets/encryption_key (never an env var). scripts/deploy.sh
    # generates it per-stack; server/encryption.ts reads it lazily.
    secrets:
      - encryption_key
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging: *default-logging
    networks:
      - traefik
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Router/service name (STACK) and host (STACK_HOST) are per-stack so many
    # branch deploys can share one Traefik without router-name collisions. The
    # defaults reproduce the original single-host behaviour
    # (STACK=community-manager, host=$DOMAIN), so an existing prod deploy that
    # sets neither variable is unaffected.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.${STACK:-community-manager}.rule=Host(`${STACK_HOST:-${DOMAIN}}`)"
      - "traefik.http.routers.${STACK:-community-manager}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${STACK:-community-manager}.tls=true"
      - "traefik.http.routers.${STACK:-community-manager}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${STACK:-community-manager}.loadbalancer.server.port=3000"

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "-u"
        - "${MONGO_INITDB_ROOT_USERNAME}"
        - "-p"
        - "${MONGO_INITDB_ROOT_PASSWORD}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    logging: *default-logging
    networks:
      - internal

volumes:
  mongo-data:
  mongo-config:

# File-based secret (non-swarm bind mount). scripts/deploy.sh writes
# ./encryption.key (mode 644 so the in-container non-root user can read the
# bind-mounted file) in each stack dir before `compose up`. For a local
# `docker compose up`, create it first: `openssl rand -hex 16 > encryption.key`.
secrets:
  encryption_key:
    file: ./encryption.key

networks:
  traefik:
    external: true
  internal:
    driver: bridge
    internal: true
